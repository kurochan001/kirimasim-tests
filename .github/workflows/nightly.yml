name: Nightly

# Runs every test of main once a day with the latest development version of
# each simulator, resolving each upstream commit for the run, and adds
# the results to the history on the results branch,
# which tools/results_history.py draws as charts (see "Nightly results" in
# README.md). The results are only reported, except that the kirimasim job
# fails when a test that matched the night before differs now; the expected
# outputs recorded with Icarus Verilog 13.0 and Verilator 5.052 are checked by
# check.yml.
#
# A failed apt-get update only warns: it can fail for a source that the runner
# image adds (packages.microsoft.com has answered 403), while the packages
# installed here come from Ubuntu's own archive.

on:
  schedule:
    - cron: "23 19 * * *"  # once a day (19:23 UTC, 04:23 JST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The latest master of Icarus Verilog, kept in the cache by its commit.
  icarus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the latest commit of Icarus Verilog
        id: head
        run: |
          sha=$(git ls-remote https://github.com/steveicarus/iverilog.git refs/heads/master |
            cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore Icarus Verilog
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/icarus
          key: icarus-${{ steps.head.outputs.sha }}-ubuntu-24.04

      # Cloned with its history, so that the version that iverilog -V prints
      # names the commit.
      - name: Build Icarus Verilog
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          sudo apt-get update || echo "::warning::apt-get update failed for some sources"
          sudo apt-get install -y autoconf gperf bison flex zlib1g-dev libbz2-dev
          git clone -q --filter=blob:none https://github.com/steveicarus/iverilog.git \
            "$RUNNER_TEMP/iverilog"
          cd "$RUNNER_TEMP/iverilog"
          git checkout -q --detach "$SHA"
          sh autoconf.sh
          ./configure -q --prefix="$HOME/icarus"
          make -s -j"$(nproc)"
          make -s install

      - name: Save Icarus Verilog
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/icarus
          key: icarus-${{ steps.head.outputs.sha }}-ubuntu-24.04

      - name: Run the suite
        run: |
          mkdir -p results
          python3 tools/run_icarus.py --iverilog-bin "$HOME/icarus/bin" -j "$(nproc)" \
            --json results/icarus.json > results/icarus.log || true
          cat results/icarus.log
          tail -n 1 results/icarus.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: results-icarus
          path: results/
          if-no-files-found: warn

  # The latest master of Verilator, kept in the cache by its commit. Every
  # test runs, not only those recorded with Verilator 5.052: the others are
  # counted as known differences when they do not match.
  verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the latest commit of Verilator
        id: head
        run: |
          sha=$(git ls-remote https://github.com/verilator/verilator.git refs/heads/master |
            cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore Verilator
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/verilator
          key: verilator-${{ steps.head.outputs.sha }}-ubuntu-24.04

      # Cloned with its history, so that the version that verilator --version
      # prints names the commit.
      - name: Build Verilator
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          sudo apt-get update || echo "::warning::apt-get update failed for some sources"
          sudo apt-get install -y help2man autoconf flex bison libfl-dev zlib1g-dev
          git clone -q --filter=blob:none https://github.com/verilator/verilator.git \
            "$RUNNER_TEMP/verilator"
          cd "$RUNNER_TEMP/verilator"
          git checkout -q --detach "$SHA"
          autoconf
          ./configure -q --prefix="$HOME/verilator"
          make -s -j"$(nproc)"
          make -s install

      - name: Save Verilator
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/verilator
          key: verilator-${{ steps.head.outputs.sha }}-ubuntu-24.04

      # Verilator solves the constraints of randomize() with an SMT solver, z3
      # by default, which the runner does not have. ccache: every test compiles
      # the same runtime library of Verilator, so the makefile of each model
      # compiles through ccache (OBJCACHE). The cache is kept for the next
      # night, which reuses what the new commit of Verilator leaves unchanged.
      # A hit returns what the compiler made from the same sources and
      # options, so the results do not change.
      - name: Install z3 and ccache
        run: |
          sudo apt-get update || echo "::warning::apt-get update failed for some sources"
          sudo apt-get install -y z3 ccache
          {
            echo "OBJCACHE=ccache"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=1G"
          } >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-verilator-master-ubuntu-24.04-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-verilator-master-ubuntu-24.04-

      # Every process of the run gets at most 6 GB of address space. A design
      # that makes Verilator recurse without end, such as the cycle of named
      # sequences of ch16/test_illegal_sequence_cycle_through_bodies, would
      # otherwise take all the memory of the runner, which then stops the job;
      # with the limit only that test fails.
      - name: Run the suite
        run: |
          mkdir -p results
          ccache -z
          ulimit -v 6291456
          python3 tools/run_verilator.py --verilator "$HOME/verilator/bin/verilator" --all \
            -j "$(nproc)" --json results/verilator.json > results/verilator.log || true
          cat results/verilator.log
          tail -n 1 results/verilator.log >> "$GITHUB_STEP_SUMMARY"
          ccache -s

      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-verilator-master-ubuntu-24.04-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: results-verilator
          path: results/
          if-no-files-found: warn

  # The latest main of kirimasim, built as its own nightly builds it.
  kirimasim:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kurochan001/kirimasim
          path: kirimasim

      - name: Cache FetchContent downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            kirimasim/build/release/_deps/*-src
            kirimasim/build/release/_deps/*-subbuild
            kirimasim/build/release/_deps/*-tmp
            kirimasim/build/release/CMakeFiles/fc-stamp
          key: >-
            kirimasim-fetchcontent-ubuntu-24.04-release-${{
            hashFiles('kirimasim/cmake/Dependencies.cmake') }}

      # kirimasim builds libfst for its FST support, which needs the zlib and
      # bzip2 development files (the FST build preparation of its README).
      - name: Install the libraries of the FST build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev libbz2-dev

      - name: Build kirimasim
        working-directory: kirimasim
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Run the suite
        run: |
          mkdir -p results
          python3 tools/run_kirimasim.py --kirimasim kirimasim/build/release/src/driver/kirimasim \
            -j "$(nproc)" --json results/kirimasim.json > results/kirimasim.log || true
          cat results/kirimasim.log
          tail -n 1 results/kirimasim.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: results-kirimasim
          path: results/
          if-no-files-found: warn

      # The ratchet: the job fails when a test that matched in the previous
      # results on the results branch differs now. New tests, unsupported ones
      # and a first night without previous results do not fail it. The publish
      # job of this run needs this job, so the results branch still holds the
      # previous night here; publish runs even when this job fails.
      - name: Compare with the previous night
        run: |
          if [ ! -f results/kirimasim.json ]; then
            echo "No results of kirimasim: the comparison is skipped."
          elif git fetch -q --depth 1 origin results &&
               git show FETCH_HEAD:latest/kirimasim.json > previous-kirimasim.json 2>/dev/null; then
            python3 tools/results_ratchet.py previous-kirimasim.json results/kirimasim.json \
              | tee ratchet.log
            status=${PIPESTATUS[0]}
            tail -n 1 ratchet.log >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          else
            echo "No previous results of kirimasim: the comparison is skipped."
          fi

  # Resolve the latest main of Lyra for each run and record that exact commit.
  # Building Lyra builds LLVM from source with Bazel, which takes hours on a
  # hosted runner, so a build is reused only for the same resolved commit.
  # A new commit builds again; a build first makes
  # room on the disk. Lyra finds its shipped files (such as svdpi.h) beside
  # the executable, in lyra.runfiles, which is copied with the executable.
  lyra:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the latest commit of Lyra
        id: head
        run: |
          set -euo pipefail
          sha=$(git ls-remote --exit-code https://github.com/hankhsu1996/lyra.git refs/heads/main |
            cut -f1)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the latest Lyra main commit."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "LYRA_COMMIT=$sha" >> "$GITHUB_ENV"
          printf 'Lyra main commit: [%s](https://github.com/hankhsu1996/lyra/commit/%s)\n' \
            "$sha" "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Lyra
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lyra
          key: lyra-${{ steps.head.outputs.sha }}-ubuntu-24.04

      - name: Make room for the build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # bazelisk is on the runner image and fetches the Bazel release that
      # Lyra's .bazelversion names.
      - name: Build Lyra
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --filter=blob:none https://github.com/hankhsu1996/lyra.git \
            "$RUNNER_TEMP/lyra"
          cd "$RUNNER_TEMP/lyra"
          git checkout -q --detach "$LYRA_COMMIT"
          bazelisk build //:lyra
          mkdir -p "$HOME/lyra"
          cp -L bazel-bin/lyra "$HOME/lyra/lyra"
          cp -rL bazel-bin/lyra.runfiles "$HOME/lyra/lyra.runfiles"
          du -sh "$HOME/lyra"

      # The runfiles manifest names each file by its place in Bazel's tree,
      # which a later job that restores the cache does not have. Without the
      # manifest, Lyra finds the files in the copied directory. A copy kept
      # in the cache before this step was added still has the manifest, so
      # it is removed after every restore as well.
      - name: Drop the runfiles manifest
        run: rm -f "$HOME/lyra/lyra.runfiles/MANIFEST"

      - name: Save Lyra
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lyra
          key: lyra-${{ steps.head.outputs.sha }}-ubuntu-24.04

      # As in the Verilator job, every process of the run gets at most 6 GB of
      # address space: on 2026-10-26 a test took all the memory of the runner
      # in Lyra's run, which stopped the job. The log is shown as the run
      # goes, so a run that stops still shows how far it got; the exit status
      # of the step is that of tee, as a test that does not match is not an
      # error of the job.
      - name: Run the suite
        run: |
          mkdir -p results
          ulimit -v 6291456
          python3 tools/run_lyra.py --lyra "$HOME/lyra/lyra" --commit "$LYRA_COMMIT" \
            -j "$(nproc)" --json results/lyra.json | tee results/lyra.log
          tail -n 1 results/lyra.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: results-lyra
          path: results/
          if-no-files-found: warn

  # An unreleased guest joins under an alias until its public debut. Private
  # checkout locations, runtime options and credentials are repository secrets.
  # Build output stays on the runner; artifacts contain only public verdicts.
  ghost:
    if: github.repository == 'kurochan001/kirimasim-tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the private simulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.GHOST_REPOSITORY }}
          path: simulator
          ssh-key: ${{ secrets.GHOST_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out its parser
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.GHOST_PARSER_REPOSITORY }}
          ref: ${{ secrets.GHOST_PARSER_REF }}
          path: ${{ secrets.GHOST_PARSER_PATH }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update || echo "::warning::apt-get update failed for some sources"
          sudo apt-get install -y ninja-build zlib1g-dev libffi-dev

      - name: Build the private simulator
        working-directory: simulator
        env:
          BUILD_TARGET: ${{ secrets.GHOST_BUILD_TARGET }}
        run: |
          if ! { cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF &&
                 cmake --build build --target "$BUILD_TARGET" --parallel "$(nproc)"
               } > "$RUNNER_TEMP/ghost-build.log" 2>&1; then
            echo "::error::The private simulator did not build; its build log stays private."
            exit 1
          fi

      - name: Run the suite
        env:
          PRIVATE_EXECUTABLE: ${{ secrets.GHOST_EXECUTABLE }}
          PRIVATE_PROFILE: ${{ secrets.GHOST_PROFILE }}
        run: |
          mkdir -p results
          umask 077
          printf '%s' "$PRIVATE_PROFILE" > "$RUNNER_TEMP/ghost-profile.json"
          ulimit -v 6291456
          status=0
          python3 tools/run_ghost.py --simulator "simulator/$PRIVATE_EXECUTABLE" \
            --include simulator/include --profile "$RUNNER_TEMP/ghost-profile.json" \
            -j "$(nproc)" --json results/ghost.json > results/ghost.log \
            2> "$RUNNER_TEMP/ghost-runner.stderr" || status=$?
          cat results/ghost.log
          tail -n 1 results/ghost.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -gt 1 ] || [ ! -f results/ghost.json ]; then
            echo "::error::The private simulator produced no valid results."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: results-ghost
          path: results/
          if-no-files-found: warn

  # Adds the results of the simulators that ran to the history on the results
  # branch, draws the charts and the report there, and pushes it. Only a run
  # of main publishes; a run started by hand on another branch only reports.
  publish:
    needs: [icarus, verilator, kirimasim, lyra, ghost]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Check out the results branch
        run: |
          if git fetch -q --depth 1 origin results; then
            git worktree add -q -B results history FETCH_HEAD
          else
            git worktree add -q --orphan -b results history
          fi

      - name: Update the history
        run: |
          shopt -s nullglob
          files=(results/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No simulator produced results."
            exit 1
          fi
          python3 tools/results_history.py update --history history \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "${files[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Measure behavioral coverage with this run's results
        run: |
          shopt -s nullglob
          files=(results/*.json)
          python3 tools/behavior_coverage.py --results "${files[@]}" \
            --output history/behavior-coverage.md --json history/behavior-coverage.json \
            --summary-output history/behavior-coverage-summary.md \
            --summary-json history/behavior-summary.json --require-source-reviewed \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA" \
            --history history/behavior-history.json
          sed -n '/^## 全規格/,/^## 章・附属書別/p' history/behavior-coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[動作カバレッジ集計](%s/%s/blob/results/behavior-coverage-summary.md)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

      - name: Measure feature interactions with this run's results
        run: |
          shopt -s nullglob
          files=(results/*.json)
          python3 tools/interaction_coverage.py --results "${files[@]}" \
            --output history/interaction-coverage.md --json history/interaction-coverage.json \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          printf '\n[機能間クロスの実行確認](%s/%s/blob/results/interaction-coverage.md)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

      - name: Push the results branch
        working-directory: history
        run: |
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Nightly results of $(date -u +%Y-%m-%d) for ${GITHUB_SHA::7}"
          git push -q origin results
