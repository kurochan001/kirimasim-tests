name: Lyra diagnosis

# One-off diagnosis of the Nightly Lyra job, run by hand. Since Lyra
# 4872d420, almost every test fails with "compiling 'sv_esc_std.cpp' failed".
# The first run of this workflow found the reason: Lyra's runtime headers use
# std::expected, which the runner's clang++ 18 does not find in libstdc++ 13,
# with or without the 6 GB limit of the Nightly job. Lyra compiles a design
# with the first clang++ or c++ on PATH, or with the compiler that --cxx
# names, and needs libstdc++ 13.2 or newer. This run takes the cached build
# of the Nightly commit and runs the tests of chapter 10 through
# tools/run_lyra.py, as the Nightly job does, with the runner's GCC 13.3 (c++)
# and with clang 20, the LLVM release that Lyra's own CI installs from
# apt.llvm.org. Nothing is built, and the Nightly results are not touched.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cxx: [c++, clang++-20]
    env:
      LYRA_COMMIT: b9c9a0613e8110a052cf178cb1e53ca6feb8eb10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Lyra
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lyra
          key: lyra-${{ env.LYRA_COMMIT }}-ubuntu-24.04
          fail-on-cache-miss: true

      - name: Drop the runfiles manifest
        run: rm -f "$HOME/lyra/lyra.runfiles/MANIFEST"

      # The same steps as Lyra's own setup of clang 20.
      - name: Install clang 20
        if: matrix.cxx == 'clang++-20'
        run: |
          set -euo pipefail
          wget -qO "$RUNNER_TEMP/llvm.key" https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg "$RUNNER_TEMP/llvm.key"
          . /etc/lsb-release
          echo "deb http://apt.llvm.org/${DISTRIB_CODENAME}/ llvm-toolchain-${DISTRIB_CODENAME}-20 main" |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20

      # tools/run_lyra.py has no --cxx yet, so a small wrapper adds it to
      # `lyra run`; `lyra check` compiles nothing and is passed through.
      - name: Make the wrapper
        env:
          CXX_NAME: ${{ matrix.cxx }}
        run: |
          command -v "$CXX_NAME"
          "$CXX_NAME" --version | head -n 1
          cat > "$RUNNER_TEMP/lyra" <<EOF
          #!/bin/bash
          if [ "\$1" = run ]; then
            shift
            exec "$HOME/lyra/lyra" run --cxx "$CXX_NAME" "\$@"
          fi
          exec "$HOME/lyra/lyra" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/lyra"

      - name: Run chapter 10
        run: |
          mkdir -p out
          ulimit -v 6291456
          python3 tools/run_lyra.py --lyra "$RUNNER_TEMP/lyra" --commit "$LYRA_COMMIT" \
            -j "$(nproc)" --json out/lyra-ch10.json tests/ch10/*.sv | tee out/lyra-ch10.log
          tail -n 1 out/lyra-ch10.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lyra-diagnosis-${{ matrix.cxx }}
          path: out/
          retention-days: 7
