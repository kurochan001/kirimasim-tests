name: Parser checkout diagnostic

# Reproduce the two Nightly checkouts with their existing scripts and secrets.
# No simulator is built or run, and raw checkout logs are never uploaded.
on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Parser authentication comparison
        type: choice
        default: normal
        options:
          - normal
          - clean-token
          - anonymous

permissions:
  contents: read

jobs:
  checkout:
    if: github.repository == 'kurochan001/kirimasim-tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the Nightly checkouts without building or running
        env:
          PRIVATE_REPOSITORY: ${{ secrets.GHOST_REPOSITORY }}
          PRIVATE_KEY: ${{ secrets.GHOST_DEPLOY_KEY }}
          PARSER_REPOSITORY: ${{ secrets.GHOST_PARSER_REPOSITORY }}
          PARSER_REF: ${{ secrets.GHOST_PARSER_REF }}
          PARSER_PATH: ${{ secrets.GHOST_PARSER_PATH }}
          TOKEN: ${{ github.token }}
          CHECKOUT_AUTH_MODE: ${{ inputs.auth_mode }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import textwrap

          workflow = Path('.github/workflows/nightly.yml').read_text(encoding='utf-8')
          for name in ('Check out the private simulator', 'Check out its parser'):
              step = workflow.split('      - name: ' + name + '\n', 1)[1].split('\n      - ', 1)[0]
              script = textwrap.dedent(step.split('        run: |\n', 1)[1])
              environment = os.environ.copy()
              mode = environment.get('CHECKOUT_AUTH_MODE', 'normal')
              if name == 'Check out its parser' and mode != 'normal':
                  environment.update(GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM='1',
                                     GIT_ASKPASS='/bin/false', GIT_TERMINAL_PROMPT='0')
                  if mode == 'anonymous':
                      script = script.replace('export GIT_CONFIG_VALUE_0\n', 'export GIT_CONFIG_VALUE_0=""\n')
              status = subprocess.call(['bash', '--noprofile', '--norc', '-eo', 'pipefail', '-c', script],
                                       env=environment)
              if status:
                  sys.exit(status)
          PY
