<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">How Nightly publishes simulator results</title>
  <desc id="desc">Nightly runs the main branch on a schedule or manually. Icarus, Verilator, kirimasim and Ghost run independently. Lyra builds, runs four shards and merges them. The publish job writes available result JSON to the results branch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b7088"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="418" rx="22" fill="#f4f7fb" stroke="#c7d3df" stroke-width="2"/>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">
    <path d="M 440 98 V 119 H 224 V 145" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 440 119 H 656 V 145" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 224 258 V 281 H 440 V 302" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 656 258 V 281 H 440" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="260" y="24" width="360" height="74" rx="12" fill="#e6f0ff" stroke="#789cc7" stroke-width="1.5"/>
    <text x="440" y="56" font-size="24" font-weight="700" fill="#172d46">Nightly on main</text>
    <text x="440" y="81" font-size="18" font-weight="400" fill="#314b65">Scheduled or manual run</text>
    <rect x="40" y="151" width="368" height="107" rx="12" fill="#ffffff" stroke="#a9bed3" stroke-width="1.5"/>
    <text x="224" y="187" font-size="24" font-weight="700" fill="#172d46">Independent jobs</text>
    <text x="224" y="212" font-size="18" font-weight="400" fill="#314b65">Icarus, Verilator, kirimasim, Ghost</text>
    <text x="224" y="237" font-size="18" font-weight="400" fill="#314b65">Prepare the build, then run tests</text>
    <rect x="472" y="151" width="368" height="107" rx="12" fill="#ffffff" stroke="#a9bed3" stroke-width="1.5"/>
    <text x="656" y="200" font-size="24" font-weight="700" fill="#172d46">Lyra jobs</text>
    <text x="656" y="225" font-size="18" font-weight="400" fill="#314b65">Build → run four shards → merge</text>
    <rect x="230" y="308" width="420" height="76" rx="12" fill="#e1f5ef" stroke="#659c91" stroke-width="1.5"/>
    <text x="440" y="341" font-size="24" font-weight="700" fill="#172d46">Publish to the results branch</text>
    <text x="440" y="366" font-size="18" font-weight="400" fill="#314b65">Collect available result JSON</text>
  </g>
</svg>
