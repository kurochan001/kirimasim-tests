<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 326" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">シミュレーションテストの合格条件</title>
  <desc id="desc">合法な設計は正規化出力が一致し、指定がある終了コードと診断の検査に通れば合格です。不正な設計は指定したエラーで拒否されれば合格です。クラッシュやタイムアウトは不合格です。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b7088"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="324" rx="22" fill="#f4f7fb" stroke="#c7d3df" stroke-width="2"/>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">
    <path d="M 440 84 V 108 H 224 V 132" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 440 108 H 656 V 132" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="270" y="26" width="340" height="58" rx="12" fill="#e6f0ff" stroke="#789cc7" stroke-width="1.5"/>
    <text x="440" y="63" font-size="24" font-weight="700" fill="#172d46">シミュレーションテスト</text>
    <rect x="40" y="138" width="368" height="126" rx="12" fill="#ffffff" stroke="#a9bed3" stroke-width="1.5"/>
    <text x="224" y="184" font-size="24" font-weight="700" fill="#172d46">合法な設計</text>
    <text x="224" y="209" font-size="18" font-weight="400" fill="#314b65">正規化した標準出力が一致</text>
    <text x="224" y="234" font-size="18" font-weight="400" fill="#314b65">指定があれば終了コード・診断も一致</text>
    <rect x="472" y="138" width="368" height="126" rx="12" fill="#ffffff" stroke="#a9bed3" stroke-width="1.5"/>
    <text x="656" y="184" font-size="24" font-weight="700" fill="#172d46">不正な設計</text>
    <text x="656" y="209" font-size="18" font-weight="400" fill="#314b65">シミュレータが設計を拒否</text>
    <text x="656" y="234" font-size="18" font-weight="400" fill="#314b65">エラーが指定の条件に一致</text>
    <text x="440" y="299" font-size="17" font-weight="400" fill="#334c68">クラッシュやタイムアウトは、どちらも不合格。</text>
  </g>
</svg>
