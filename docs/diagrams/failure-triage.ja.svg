<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">Fail の切り分けと起票先</title>
  <desc id="desc">バージョンとテスト条件をそろえてFailを再現します。テストやランナーに原因がある場合は kirimasim-tests、シミュレータの動作が規格と異なる場合はシミュレータ側へ。原因が未確定なら観測を保存して調査を続けます。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b7088"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="380" rx="22" fill="#f4f7fb" stroke="#c7d3df" stroke-width="2"/>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">
    <path d="M 440 110 V 137 H 156 V 175" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 440 137 V 175" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 440 137 H 724 V 175" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="196" y="28" width="488" height="82" rx="12" fill="#e6f0ff" stroke="#789cc7" stroke-width="1.5"/>
    <text x="440" y="64" font-size="24" font-weight="700" fill="#172d46">Fail を再現する</text>
    <text x="440" y="89" font-size="18" font-weight="400" fill="#314b65">版・起動条件・実測結果を記録</text>
    <rect x="34" y="181" width="244" height="128" rx="12" fill="#ffffff" stroke="#a9bed3" stroke-width="1.5"/>
    <text x="156" y="228" font-size="24" font-weight="700" fill="#172d46">テスト側の問題</text>
    <text x="156" y="253" font-size="18" font-weight="400" fill="#314b65">入力・期待値・ランナー</text>
    <text x="156" y="278" font-size="18" font-weight="400" fill="#314b65">kirimasim-tests の Issue</text>
    <rect x="318" y="181" width="244" height="128" rx="12" fill="#e1f5ef" stroke="#659c91" stroke-width="1.5"/>
    <text x="440" y="228" font-size="24" font-weight="700" fill="#172d46">シミュレータの問題</text>
    <text x="440" y="253" font-size="18" font-weight="400" fill="#314b65">規格と異なる動作を再現</text>
    <text x="440" y="278" font-size="18" font-weight="400" fill="#314b65">シミュレータ側の Issue</text>
    <rect x="602" y="181" width="244" height="128" rx="12" fill="#eef2f7" stroke="#a9b9ca" stroke-width="1.5"/>
    <text x="724" y="228" font-size="24" font-weight="700" fill="#172d46">原因は未確定</text>
    <text x="724" y="253" font-size="18" font-weight="400" fill="#314b65">観測した結果を保存</text>
    <text x="724" y="278" font-size="18" font-weight="400" fill="#314b65">対照ケースを使って調査</text>
    <text x="440" y="350" font-size="17" font-weight="400" fill="#334c68">結果を報告する前に、既存の Issue を確認する。</text>
  </g>
</svg>
