<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 326" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">How simulation tests pass</title>
  <desc id="desc">Legal examples pass when normalized output matches and requested exit and diagnostic checks succeed. Intentional illegal examples pass when rejected with the specified error. A crash or timeout is a failure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b7088"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="324" rx="22" fill="#f4f7fb" stroke="#c7d3df" stroke-width="2"/>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif">
    <path d="M 440 84 V 108 H 224 V 132" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 440 108 H 656 V 132" fill="none" stroke="#5b7088" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="270" y="26" width="340" height="58" rx="12" fill="#e6f0ff" stroke="#789cc7" stroke-width="1.5"/>
    <text x="440" y="63" font-size="24" font-weight="700" fill="#172d46">Simulation test</text>
    <rect x="40" y="138" width="368" height="126" rx="12" fill="#ffffff" stroke="#a9bed3" stroke-width="1.5"/>
    <text x="224" y="184" font-size="24" font-weight="700" fill="#172d46">Legal design</text>
    <text x="224" y="209" font-size="18" font-weight="400" fill="#314b65">Normalized stdout matches</text>
    <text x="224" y="234" font-size="18" font-weight="400" fill="#314b65">Check specified exit code and diagnostics</text>
    <rect x="472" y="138" width="368" height="126" rx="12" fill="#ffffff" stroke="#a9bed3" stroke-width="1.5"/>
    <text x="656" y="184" font-size="24" font-weight="700" fill="#172d46">Intentionally illegal design</text>
    <text x="656" y="209" font-size="18" font-weight="400" fill="#314b65">The simulator rejects the design</text>
    <text x="656" y="234" font-size="18" font-weight="400" fill="#314b65">The error matches the expected condition</text>
    <text x="440" y="299" font-size="17" font-weight="400" fill="#334c68">A crash or timeout fails either kind of test.</text>
  </g>
</svg>
